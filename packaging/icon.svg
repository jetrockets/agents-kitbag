<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon: a kitbag, with a dot for each of several assistants.
       packaging/icon.sh draws the PNGs from it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4556"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dae2"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="22"/><feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="bodyclip"><rect x="188" y="412" width="648" height="372" rx="124"/></clipPath>
  </defs>
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#bg)"/>
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#sheen)"/>
  <g filter="url(#shadow)">
    <path d="M392 440V372C392 300 440 258 512 258S632 300 632 372V440" fill="none" stroke="#e5e7eb" stroke-width="46" stroke-linecap="round"/>
    <rect x="188" y="412" width="648" height="372" rx="124" fill="url(#body)"/>
    <g clip-path="url(#bodyclip)">
      <rect x="188" y="412" width="648" height="92" fill="#000000" opacity="0.07"/>
      <rect x="369" y="412" width="46" height="372" fill="#6b7280"/>
      <rect x="609" y="412" width="46" height="372" fill="#6b7280"/>
      <rect x="188" y="500" width="648" height="10" fill="#9ca3af"/>
    </g>
    <rect x="484" y="482" width="56" height="46" rx="14" fill="#6b7280"/>
    <circle cx="452" cy="640" r="30" fill="#f59e0b"/><circle cx="512" cy="640" r="30" fill="#10b981"/><circle cx="572" cy="640" r="30" fill="#3b82f6"/>
  </g>
</svg>