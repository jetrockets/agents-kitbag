[package]
name = "agents-kitbag-core"
description = "Agents Kitbag without a window: the Claude Desktop config, credential stores, integrations and token health"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["net"]
# The real HTTP client. The runner makes no requests and leaves it out.
net = ["dep:ureq", "dep:native-tls"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# The services' own APIs: validating a token and checking its health. Blocking,
# from a worker thread. native-tls (Secure Transport, SChannel) rather than
# rustls keeps ring's C and assembly out of the runner.
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"], optional = true }
native-tls = { version = "0.2", optional = true }
# Codex keeps its servers in a TOML file with the person's comments and
# everything else it is set up with: edited in place, never re-serialized.
toml_edit = "0.25"
# Jira's Basic authorization header.
base64 = "0.22"
# The private folder a 1Password item template sits in for a moment.
tempfile.workspace = true
