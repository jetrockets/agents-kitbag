[package]
name = "agents-kitbag-app"
description = "Agents Kitbag: what an AI assistant is equipped with, set up from one window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "agents-kitbag"
path = "src/main.rs"

[dependencies]
# The config, the credential stores, the integrations and their health checks.
agents-kitbag-core = { workspace = true, features = ["net"] }
# Errors at the edges (startup, updates) where callers only report them.
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# The command line: --demo, --demo-shot, --verbose and --version.
clap = { version = "4.5", features = ["derive"] }
# The log folder.
directories = "6"
# The UI. glow keeps the binary small; the window needs no wgpu.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts"] }
egui = "0.36"
# The icons are SVG; the same crate writes --demo-shot's PNG.
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# The update feed, through fastframe-update's transport.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# The shared foundation of a family of egui apps (crmne/fastframe).
# Every crate from the same tag; move them together.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7" }
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.1.7", features = ["reqwest"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The window systems winit talks to. Features unify with the line above.
eframe = { version = "0.36", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The alert shown when the app cannot start: a double-clicked app has no stderr.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
# Drives the window headlessly: real clicks and keys, and the AccessKit tree.
egui_kittest = { version = "0.36", default-features = false }
tempfile.workspace = true
