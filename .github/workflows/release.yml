name: Release

# A v* tag builds every package and publishes a GitHub release with signed
# checksums. Installed copies read the repository's latest release and update
# themselves from it, so what is published here reaches people's machines.
# Run it by hand (workflow_dispatch) for a dry run that builds and uploads
# the artifacts but publishes nothing.
#
# Nothing is code-signed yet: macOS gets the ad-hoc signature arm64 needs,
# Windows none. Gatekeeper and SmartScreen will ask the first time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag that disagrees with Cargo.toml would publish mislabelled packages,
  # so check it before anything is built. The dry run takes the version from
  # Cargo.toml.
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml; expected tag v${version}."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest image, for the oldest glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      # No compiler cache: published binaries never build from restored outputs.
      - run: cargo build --release --locked -p agents-kitbag-app -p agents-kitbag-runner
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh target/release "$VERSION" dist
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging\windows\package.ps1 -BinDir target\release -Version $env:VERSION -OutDir dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal app
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p agents-kitbag-app -p agents-kitbag-runner
          cargo build --release --locked --target x86_64-apple-darwin -p agents-kitbag-app -p agents-kitbag-runner
      - name: Universal binaries
        run: |
          mkdir -p universal
          for binary in agents-kitbag agents-kitbag-runner; do
            lipo -create "target/aarch64-apple-darwin/release/$binary" \
              "target/x86_64-apple-darwin/release/$binary" -output "universal/$binary"
          done
      - name: App and DMG
        run: |
          mkdir -p dist
          bash packaging/macos/bundle.sh universal/agents-kitbag universal/agents-kitbag-runner \
            "dist/Agents Kitbag.app" "$VERSION"
          bash packaging/macos/dmg.sh "dist/Agents Kitbag.app" "dist/agents-kitbag-v$VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # The only job that sees the update-signing key, and the only one that
  # writes. It builds nothing: cargo runs the build scripts and proc macros of
  # every dependency, and none of them should run beside the key.
  #
  # The key lives in the release-signing environment, which takes jobs from
  # v* tags only: no other workflow run, branch or pull request can read it.
  publish:
    name: GitHub release
    needs: [version, build, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    steps:
      # The public key the signature is checked against, and the release notes.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # Writes checksums.txt and checksums.txt.sig, a raw Ed25519 signature
      # over its exact bytes, after checking that the secret matches the key
      # compiled into the app. An installed copy installs nothing without a
      # valid signature. See packaging/UPDATE_SIGNING.md.
      - name: Sign update manifest
        uses: crmne/native-packages/.github/actions/sign-release@999768410cf53cdc68c8679c09cb14de1a6bca7b # v0.8.1
        with:
          directory: dist
          public-key: crates/agents-kitbag-app/assets/update-public-key.hex
          key-env: UPDATE_SIGNING_KEY
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      # packaging/release-notes/<tag>.md when there is one, GitHub's own
      # notes otherwise.
      - name: Release notes
        id: notes
        run: |
          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
            echo "written=true" >> "$GITHUB_OUTPUT"
          else
            echo "written=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Agents Kitbag ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.written == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.written != 'true' }}
          # v0.24.0-rc1 is a pre-release, and installed copies are never
          # offered one: they read the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
