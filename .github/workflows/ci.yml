name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch replaces the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints and docs once, on one system.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler, clippy and rustfmt.
      - run: rustup show active-toolchain || rustup toolchain install
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets --all-features
      # The one thing made-up commands cannot stand in for: the system's own
      # credential store, through the app's code and through the built runner.
      - name: Native credential store round trip
        if: runner.os == 'Windows' || runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          cargo test --locked --workspace --all-features --lib store::tests::native_store_round_trip -- --ignored --exact
          cargo test --locked --workspace --all-features --test cli a_native_secret_reaches_the_server -- --ignored --exact
